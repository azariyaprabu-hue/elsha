<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 260" width="100%" height="100%">
  <defs>
    <!-- Brand Purple Color definition -->
    <linearGradient id="ziathlonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#7E1FA8" />
      <stop offset="100%" stopColor="#681292" />
    </linearGradient>
  </defs>

  <!-- SHIELD EMBLEM -->
  <g transform="translate(185, 20) scale(1.15)">
    <!-- 1. Top Shield Segment -->
    <path
      d="M 18,34 L 81,34 L 20,53 Z"
      fill="#7016B7"
    />

    <!-- 2. Middle Dynamic Diagonal Segment -->
    <path
      d="M 22,62 L 81,38 L 76,60 L 28,78 Z"
      fill="#7016B7"
    />

    <!-- 3. Bottom Shield Apex Tip Segment -->
    <path
      d="M 34,85 L 69,73 L 49,103 Z"
      fill="#7016B7"
    />

    <!-- 4. Top-Right Floating Medical Cross (+) -->
    <g transform="translate(84, 15)">
      <rect
        x="0"
        y="6.2"
        width="19"
        height="6.6"
        rx="1.8"
        fill="#191826"
      />
      <rect
        x="6.2"
        y="0"
        width="6.6"
        height="19"
        rx="1.8"
        fill="#191826"
      />
    </g>
  </g>

  <!-- WORDMARK: ŽIΛTHLON -->
  <g transform="translate(250, 182)" text-anchor="middle">
    <!-- Purple Caron / Chevron accent over Ž -->
    <path
      d="M -168,-36 L -162,-26 L -156,-36 L -159,-36 L -162,-30 L -165,-36 Z"
      fill="#7E1FA8"
    />

    <!-- Custom styled typography for ŽIΛTHLON with stylized inverted-V Lambda (Λ) -->
    <text
      x="0"
      y="0"
      font-family="'Playfair Display', 'Didot', 'Bodoni MT', 'Cinzel', 'Cormorant Garamond', serif"
      font-size="44"
      font-weight="900"
      letter-spacing="0.16em"
      fill="#000000"
    >
      ŽI<tspan dx="-2" font-family="'Cinzel', 'Playfair Display', serif">Λ</tspan><tspan dx="-2">THLON</tspan>
    </text>

    <!-- SUBTITLE: SPORTS MEDICINE CLINIC in brand purple -->
    <text
      x="0"
      y="24"
      font-family="'Montserrat', 'Plus Jakarta Sans', sans-serif"
      font-size="11"
      font-weight="700"
      letter-spacing="0.42em"
      fill="#7E1FA8"
    >
      SPORTS MEDICINE CLINIC
    </text>
  </g>
</svg>
